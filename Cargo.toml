[package]
name = "acp-agent"
version = "0.0.5"
edition = "2024"
description = "CLI for discovering, installing, and running ACP agents"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/OpenInsightDev/acp-agent"
homepage = "https://github.com/OpenInsightDev/acp-agent"
documentation = "https://docs.rs/acp-agent"
keywords = ["acp", "agent", "cli", "registry"]
categories = ["command-line-utilities"]

[profile.release]
strip = true

[dependencies]
anyhow = "1.0.102"
agent-client-protocol = "2.0.0"
agent-client-protocol-http = { version = "2.0.0", features = ["server"] }
axum = "0.8"
bzip2 = "0.6.1"
clap = { version = "4.6.0", features = ["derive"] }
dirs = "6.0.0"
flate2 = "1.1.9"
futures = "0.3.32"
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
tar = "0.4.45"
tokio = { version = "1.52.0", features = [
  "fs",
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.5", features = ["util"] }
# Registry ZIP assets use standard deflate; keep the codec/encryption surface minimal.
zip = { version = "8.4.0", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
async-tungstenite = { version = "0.35.0", features = ["tokio-runtime"] }
reqwest = { version = "0.13.2", features = ["stream"] }
tempfile = "3.27.0"
