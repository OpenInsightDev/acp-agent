name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  BIN_NAME: acp-agent

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset_suffix: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_suffix: linux-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset_suffix: darwin-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            asset_suffix: darwin-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: |
          mkdir -p dist/data
          cp "target/${TARGET}/release/${BIN_NAME}" dist/
          cp data/yolo-modes.json dist/data/yolo-modes.json
          # Asset names carry no version so installers can use the
          # releases/latest/download/ redirect; old versions stay reachable
          # via releases/download/<tag>/.
          tar -czf "dist/${BIN_NAME}-${ASSET_SUFFIX}.tar.gz" -C dist "${BIN_NAME}" data/yolo-modes.json
          rm dist/${BIN_NAME}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_suffix }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        run: |
          if ! cargo publish --locked 2> /tmp/publish.err; then
            grep -qiE "already (exists|uploaded)|is already uploaded" /tmp/publish.err \
              || { cat /tmp/publish.err; exit 1; }
          fi

  release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: cp scripts/install.sh data/yolo-modes.json dist/

      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz yolo-modes.json > SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/install.sh
            dist/yolo-modes.json
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
          overwrite_files: true

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
